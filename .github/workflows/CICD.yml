name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Build the Docker image
        run: docker build -t TONPSEUDO_DOCKER_HUB/LE_NOM_QUE_TU_VEUX_POUR_TON_IMAGE .
      - name: Run tests
        run: docker run ONPSEUDO_DOCKER_HUB/LE_NOM_QUE_TU_VEUX_POUR_TON_IMAGE pytest
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push the Docker image
        run: docker push ONPSEUDO_DOCKER_HUB/LE_NOM_QUE_TU_VEUX_POUR_TON_IMAGE
