name: CI Streamlit

on:
  push:
    branches: [ "main" ] # Ou la branche que vous utilisez

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt # Installation des dépendances de Streamlit
      - name: Run Streamlit tests
        run: |
          python -m pytest app/tests/test_streamlit.py # Exécution des tests